<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130" role="img" aria-label="เส้นเชื่อมหาทางผ่านกำแพงที่มีช่องว่างช่องเดียวได้ แม้วิธีปกติหาไม่เจอ">
  <style>
    .s { fill: #F5F5F7; stroke: #D5D5DC; stroke-width: 1.5; }
    .s2 { fill: #ECECF1; stroke: #C9C9D2; stroke-width: 1.5; }
    .w { fill: none; stroke: #1E1E24; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bad { stroke: #E5484D; }
    .c { fill: #1E1E24; }
    .cbad { fill: #E5484D; }
    .tag { font: 600 9px -apple-system, sans-serif; }
    .before { fill: #E5484D; }
    .after { fill: #12A594; }
    @media (prefers-color-scheme: dark) {
      .s { fill: #26262C; stroke: #3A3A44; }
      .s2 { fill: #2E2E36; stroke: #43434F; }
      .w { stroke: #E8E8EE; }
      .c { fill: #E8E8EE; }
    }
  </style>
  <rect class="s" x="12" y="46" width="46" height="38" rx="5"/>
  <rect class="s" x="242" y="46" width="46" height="38" rx="5"/>

  <rect class="s2" x="80" y="40" width="140" height="80" rx="5"/>
  <rect class="s2" x="80" y="40" width="140" height="80" rx="5"/>

  <g>
    <path class="w bad" d="M58 65 L242 65"/>
    <path class="cbad" d="M240 59 L252 65 L240 71 Z"/>
    <circle class="cbad" cx="58" cy="65" r="3"/>
    <text class="tag before" x="150" y="112" text-anchor="middle">ก่อน — ไม่เจอทาง เลยเลือกทางที่แย่น้อยสุด</text>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.48;0.92;1" dur="3.2s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <path class="w" d="M58 65 L100 65 L100 27 L200 27 L200 65 L242 65"/>
    <path class="c" d="M240 59 L252 65 L240 71 Z"/>
    <circle class="c" cx="58" cy="65" r="3"/>
    <text class="tag after" x="150" y="112" text-anchor="middle">หลัง — ค้นหาแล้วเจอช่องว่างด้านบน</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.48;0.92;1" dur="3.2s" repeatCount="indefinite"/>
  </g>
</svg>
