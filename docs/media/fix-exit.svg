  <rect class="b" x="26" y="50" width="58" height="5" rx="2.5"/>
  <rect class="chip" x="26" y="76" width="30" height="12" rx="4"/>
  <rect class="s" x="220" y="30" width="66" height="54" rx="6"/>
  <rect class="b" x="230" y="40" width="28" height="4" rx="2"/>
  <g>
