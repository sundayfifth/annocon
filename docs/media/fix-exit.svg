<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130" role="img" aria-label="ก่อน: เส้นลากผ่านทั้งจอ หลัง: ออกทางขอบที่ใกล้ที่สุด">
