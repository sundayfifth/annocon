<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="ANNOCON — โน้ตและเส้นเชื่อมที่ผูกติดกับไฟล์ Figma จริง">
  <style>
    .name { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1E1E24; letter-spacing: -0.5px; }
    .tag { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8B8B96; }
    .s { fill: #F5F5F7; stroke: #D5D5DC; stroke-width: 1.5; }
    .s2 { fill: #ECECF1; stroke: #C9C9D2; stroke-width: 1.5; }
    .b { fill: #DEDEE6; }
    .w { fill: none; stroke: #1E1E24; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .c { fill: #1E1E24; }
    .card { fill: #FFFFFF; stroke: #E1E1E6; stroke-width: 1.5; }
    .t { fill: #C9C9D2; }
    .chip { fill: #FECC00; }
    .lead { stroke: #1E1E24; stroke-width: 1.6; stroke-dasharray: 3 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #F2F2F5; }
      .tag { fill: #8B8B96; }
      .s { fill: #26262C; stroke: #3A3A44; }
      .s2 { fill: #2E2E36; stroke: #43434F; }
      .b { fill: #3A3A44; }
      .w { stroke: #E8E8EE; }
      .c { fill: #E8E8EE; }
      .card { fill: #1C1C21; stroke: #3A3A44; }
      .t { fill: #4A4A56; }
      .lead { stroke: #E8E8EE; }
    }
  </style>

  <g transform="translate(48, 74)">
    <rect class="chip" x="0" y="-30" width="46" height="10" rx="5"/>
    <text class="name" x="0" y="14">ANNOCON</text>
    <text class="tag" x="0" y="44">โน้ตและเส้นเชื่อมที่อยู่ในไฟล์จริง ไม่หายตอน export</text>
    <text class="tag" x="0" y="66">Figma plugin · Annotate &amp; Connect</text>
  </g>

  <g transform="translate(470, 34)">
    <rect class="s" x="0" y="24" width="82" height="110" rx="7"/>
    <rect class="b" x="12" y="38" width="36" height="6" rx="3"/>
    <rect class="b" x="12" y="52" width="54" height="6" rx="3"/>

    <rect class="s2" x="150" y="24" width="82" height="110" rx="7"/>
    <rect class="b" x="162" y="38" width="36" height="6" rx="3"/>

    <rect class="s" x="300" y="24" width="82" height="110" rx="7"/>
    <rect class="b" x="312" y="38" width="36" height="6" rx="3"/>

    <path class="w" d="M82 79 L98 79 Q108 79 108 89 L108 150 Q108 160 118 160 L264 160 Q274 160 274 150 L274 89 Q274 79 284 79 L292 79">
      <animate attributeName="stroke-dasharray" values="0 700;700 0;700 0" keyTimes="0;0.45;1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.32 0 0.12 1;0 0 1 1"/>
    </path>
    <path class="c" d="M290 73 L302 79 L290 85 Z">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.55;1" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <circle class="c" cx="82" cy="79" r="3.5">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <g>
      <path class="lead" d="M232 60 L252 60"/>
      <rect class="card" x="256" y="34" width="118" height="52" rx="7"/>
      <rect class="chip" x="266" y="44" width="26" height="10" rx="5"/>
      <rect class="t" x="266" y="62" width="94" height="5" rx="2.5"/>
      <rect class="t" x="266" y="72" width="66" height="5" rx="2.5"/>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.72;1" dur="3.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
