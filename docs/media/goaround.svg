<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" role="img" aria-label="สั่งให้เส้นอ้อมด้านบนหรือด้านล่างเองได้ด้วย Go around">
  <style>
