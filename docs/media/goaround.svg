  <rect class="b" x="129" y="42" width="26" height="4" rx="2"/>
  <rect class="s" x="228" y="34" width="58" height="52" rx="5"/>
  <rect class="b" x="236" y="42" width="26" height="4" rx="2"/>
  <g>
