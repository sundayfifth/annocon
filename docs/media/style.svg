<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" role="img" aria-label="ปรับสี ความหนา รูปแบบเส้น และหัวท้ายเส้นได้">
  <style>
    .s { fill: #F5F5F7; stroke: #D5D5DC; stroke-width: 1.5; }
    .s2 { fill: #ECECF1; stroke: #C9C9D2; stroke-width: 1.5; }
    .b { fill: #DEDEE6; }
    .w { fill: none; stroke: #1E1E24; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .d { stroke-dasharray: 3 3; }
    .c { fill: #1E1E24; }
    .card { fill: #FFFFFF; stroke: #E1E1E6; stroke-width: 1.5; }
    .t { fill: #C9C9D2; }
    .pill { fill: #FECC00; }
    .txt { font: 600 9px -apple-system, sans-serif; fill: #8B8B96; }
    @media (prefers-color-scheme: dark) {
      .s { fill: #26262C; stroke: #3A3A44; }
      .s2 { fill: #2E2E36; stroke: #43434F; }
      .b { fill: #3A3A44; }
      .w { stroke: #E8E8EE; }
      .c { fill: #E8E8EE; }
      .card { fill: #1C1C21; stroke: #3A3A44; }
      .t { fill: #4A4A56; }
    }
  </style>
  <g class="w">
    <path d="M40 32 L240 32"/>
    <path d="M40 60 Q140 60 140 60 T240 60">
      <animate attributeName="d" values="M40 60 L240 60;M40 60 Q140 20 240 60;M40 60 L140 60 L140 60 L240 60;M40 60 L240 60" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M40 88 L240 88" stroke-dasharray="6 5"/>
  </g>
  <g class="c">
    <circle cx="40" cy="32" r="3.5"/>
    <path d="M240 26 L252 32 L240 38 Z"/>
    <circle cx="40" cy="60" r="3.5"/>
    <path d="M246 60 L237 55 L237 65 Z"/>
    <circle cx="40" cy="88" r="3.5"/>
    <path d="M240 82 L252 88 L240 94 L245 88 Z"/>
  </g>
  <g>
    <rect class="w" x="26" y="20" width="248" height="80" rx="6" fill="none" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.25"/>
  </g>
</svg>
