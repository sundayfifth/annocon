<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130" role="img" aria-label="ดัดเส้นเองแล้วรูปทรงยังตาม layer ไปด้วยเมื่อจอขยับ">
  <style>
    .s { fill: #F5F5F7; stroke: #D5D5DC; stroke-width: 1.5; }
    .b { fill: #DEDEE6; }
    .w { fill: none; stroke: #1E1E24; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .c { fill: #1E1E24; }
    .pt { fill: #FFFFFF; stroke: #0D99FF; stroke-width: 1.5; }
    .tag { font: 600 9px -apple-system, sans-serif; fill: #8B8B96; }
    @media (prefers-color-scheme: dark) {
      .s { fill: #26262C; stroke: #3A3A44; }
      .b { fill: #3A3A44; }
      .w { stroke: #E8E8EE; }
      .c { fill: #E8E8EE; }
      .pt { fill: #1C1C21; }
    }
  </style>
  <rect class="s" x="14" y="30" width="58" height="52" rx="5"/>
  <rect class="b" x="22" y="38" width="26" height="4" rx="2"/>

  <g>
    <rect class="s" x="212" y="30" width="58" height="52" rx="5">
      <animate attributeName="y" values="30;30;62;62;30" keyTimes="0;0.42;0.62;0.9;1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1"/>
    </rect>
    <rect class="b" x="220" y="38" width="26" height="4" rx="2">
      <animate attributeName="y" values="38;38;70;70;38" keyTimes="0;0.42;0.62;0.9;1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1"/>
    </rect>
  </g>

  <path class="w" d="M72 56 L106 56 L106 56 L140 56 L140 56 L202 56">
    <animate attributeName="d"
      values="M72 56 L106 56 L106 56 L140 56 L140 56 L202 56;M72 56 L106 56 L106 100 L140 100 L140 56 L202 56;M72 56 L106 56 L106 100 L140 100 L140 56 L202 56;M72 56 L106 56 L106 116 L140 116 L140 88 L202 88;M72 56 L106 56 L106 116 L140 116 L140 88 L202 88;M72 56 L106 56 L106 56 L140 56 L140 56 L202 56"
      keyTimes="0;0.22;0.42;0.62;0.9;1" dur="3.4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1"/>
  </path>
  <path class="c" d="M200 50 L212 56 L200 62 Z">
    <animate attributeName="d" values="M200 50 L212 56 L200 62 Z;M200 50 L212 56 L200 62 Z;M200 50 L212 56 L200 62 Z;M200 82 L212 88 L200 94 Z;M200 82 L212 88 L200 94 Z;M200 50 L212 56 L200 62 Z" keyTimes="0;0.22;0.42;0.62;0.9;1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1"/>
  </path>
  <circle class="c" cx="72" cy="56" r="3"/>

  <g>
    <circle class="pt" cx="123" cy="56" r="4">
      <animate attributeName="cy" values="56;100;100;116;116;56" keyTimes="0;0.22;0.42;0.62;0.9;1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1;0 0 1 1;0.32 0 0.12 1"/>
    </circle>
    <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.28;0.4;0.62;0.9;1" dur="3.4s" repeatCount="indefinite"/>
  </g>

  <text class="tag" x="150" y="126" text-anchor="middle">
    ดัดเอง
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.38;0.46;1" dur="3.4s" repeatCount="indefinite"/>
  </text>
  <text class="tag" x="150" y="126" text-anchor="middle" opacity="0">
    จอขยับ — รูปทรงตามไปด้วย
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.56;0.9;1" dur="3.4s" repeatCount="indefinite"/>
  </text>
