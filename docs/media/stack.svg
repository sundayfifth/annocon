<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" role="img" aria-label="การ์ดหลบออกไปข้างเฟรมและขยับหนีกันเองไม่ให้ซ้อน">
  <style>
    .s { fill: #F5F5F7; stroke: #D5D5DC; stroke-width: 1.5; }
    .s2 { fill: #ECECF1; stroke: #C9C9D2; stroke-width: 1.5; }
    .b { fill: #DEDEE6; }
    .w { fill: none; stroke: #1E1E24; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .d { stroke-dasharray: 3 3; }
    .c { fill: #1E1E24; }
    .card { fill: #FFFFFF; stroke: #E1E1E6; stroke-width: 1.5; }
    .t { fill: #C9C9D2; }
    .pill { fill: #0D99FF; }
    .txt { font: 600 9px -apple-system, sans-serif; fill: #8B8B96; }
    @media (prefers-color-scheme: dark) {
      .s { fill: #26262C; stroke: #3A3A44; }
      .s2 { fill: #2E2E36; stroke: #43434F; }
      .b { fill: #3A3A44; }
      .w { stroke: #E8E8EE; }
      .c { fill: #E8E8EE; }
      .card { fill: #1C1C21; stroke: #3A3A44; }
      .t { fill: #4A4A56; }
    }
  </style>
  <rect class="s" x="14" y="16" width="96" height="92" rx="6"/>
  <rect class="b" x="26" y="28" width="42" height="6" rx="3"/>
  <path class="w d" d="M110 40 L146 40"/>
  <path class="w d" d="M110 78 L146 78"/>
  <circle class="c" cx="110" cy="40" r="3"/>
  <circle class="c" cx="110" cy="78" r="3"/>
  <rect class="card" x="150" y="20" width="132" height="40" rx="6">
    <animate attributeName="y" values="34;20;20;34" keyTimes="0;0.3;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect class="t" x="160" y="32" width="100" height="5" rx="2.5">
    <animate attributeName="y" values="46;32;32;46" keyTimes="0;0.3;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect class="card" x="150" y="68" width="132" height="40" rx="6">
    <animate attributeName="y" values="54;68;68;54" keyTimes="0;0.3;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect class="t" x="160" y="80" width="80" height="5" rx="2.5">
    <animate attributeName="y" values="66;80;80;66" keyTimes="0;0.3;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
