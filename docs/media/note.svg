<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" role="img" aria-label="การ์ดโน้ตเกาะอยู่กับ layer ด้วยเส้นประ">
  <style>
    .s { fill: #F5F5F7; stroke: #D5D5DC; stroke-width: 1.5; }
    .s2 { fill: #ECECF1; stroke: #C9C9D2; stroke-width: 1.5; }
    .b { fill: #DEDEE6; }
    .w { fill: none; stroke: #1E1E24; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .d { stroke-dasharray: 3 3; }
    .c { fill: #1E1E24; }
    .card { fill: #FFFFFF; stroke: #E1E1E6; stroke-width: 1.5; }
    .t { fill: #C9C9D2; }
    .pill { fill: #FECC00; }
    .txt { font: 600 9px -apple-system, sans-serif; fill: #8B8B96; }
    @media (prefers-color-scheme: dark) {
      .s { fill: #26262C; stroke: #3A3A44; }
      .s2 { fill: #2E2E36; stroke: #43434F; }
      .b { fill: #3A3A44; }
      .w { stroke: #E8E8EE; }
      .c { fill: #E8E8EE; }
      .card { fill: #1C1C21; stroke: #3A3A44; }
      .t { fill: #4A4A56; }
    }
  </style>
  <rect class="s" x="14" y="20" width="96" height="84" rx="6"/>
  <rect class="b" x="26" y="32" width="42" height="6" rx="3"/>
  <rect class="b" x="26" y="46" width="62" height="6" rx="3"/>
  <g>
    <path class="w d" d="M110 62 L146 62"/>
    <circle class="c" cx="110" cy="62" r="3"/>
    <rect class="card" x="150" y="30" width="132" height="64" rx="6"/>
    <rect class="pill" x="160" y="40" width="30" height="12" rx="6"/>
    <rect class="t" x="160" y="60" width="110" height="5" rx="2.5"/>
    <rect class="t" x="160" y="72" width="86" height="5" rx="2.5"/>
    <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.25;0.9;1" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
